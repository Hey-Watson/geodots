<style>
  :root {
    --ground: #1B2A38; --ground-deep: #152230;
    --ink: #E8DFC8; --ink-dim: #A9A08C;
    --brass: #B08D57; --brass-bright: #C9A876;
    --verdigris: #6B8F71;
    --danger: #B2574C;
    --line: #3A4C5C;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .page {
    max-width: 720px; width: 100%;
    position: relative; z-index: 1; background: var(--ground);
  }
  /* PREVIEW ONLY, not committed: hybrid width. .page is wide (720px) for
     the header/board/archive/footer, but the clues/tray/controls/share
     section reads better at the original narrower 520px -- this wraps
     just that middle section and centers it independently within the
     wider outer page. */
  .inner-narrow { max-width: 520px; margin: 0 auto; }

  /* Atmospheric star field, fixed behind everything. Only ever visible in
     the empty margin around the card: .page carries its own opaque
     background (above) so the card's own interior always masks it. */
  #stars-bg {
    position: fixed; inset: 0; width: 100vw; height: 100vh;
    z-index: 0; pointer-events: none;
  }
  #stars-bg .stars { fill: var(--ink-dim); opacity: 0.35; }
  #stars-bg .stars .bright { fill: var(--ink); }
  #stars-bg .constellation-lines { stroke: var(--ink-dim); stroke-width: 0.7; fill: none; opacity: 0.15; }
  #stars-bg .astrolabe { stroke: var(--brass); stroke-width: 1; opacity: 0.15; fill: none; }
  #stars-bg .astrolabe .sightline { stroke-width: 0.7; }

  /* NOTE ON FONTS: the brief restricts IBM Plex Mono to numeric data only
     (day count / check count / timer) -- narrower than the mock's own CSS,
     which uses Plex Mono for buttons, labels and node text too. Everywhere
     the mock uses Plex Mono for non-numeric text, this file uses Source
     Serif 4 instead, per that explicit instruction. Only elements with
     class="num" (or the node label font, see renderGraph) get Plex Mono. */
  .num { font-family: 'IBM Plex Mono', monospace; }

  .eyebrow {
    font-family: 'Source Serif 4', serif; font-size: 11px;
    color: var(--brass-bright); letter-spacing: 0.12em; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
  }
  /* Explicit height, not left to the page's generic svg{width:100%} rule
     (that rule targets the puzzle board's own <svg>, but this is a
     plain <img> so it's not actually affected -- still sized explicitly
     here rather than relying on the file's own pixel dimensions, same
     reasoning as every other small icon on this page). Sized to read
     clearly as a wordmark (the constellation icon has fine detail that
     disappears if scaled down to match the 11px eyebrow text next to
     it) while staying a clear "eyebrow", not competing with the "Chart
     the region" heading below it. width:auto preserves the source
     image's own aspect ratio. */
  .wordmark { display: block; height: 22px; width: auto; }
  .eyebrow em { text-transform: none; }
  .eyebrow .sub-brand-link {
    text-transform: none; font-style: italic; color: inherit;
    text-decoration: none;
  }
  .eyebrow .sub-brand-link:hover { color: var(--ink); text-decoration: underline; }
  .lang-toggle { margin-left: 10px; letter-spacing: 0.05em; }
  .lang-opt {
    background: none; border: none; padding: 0 1px; cursor: pointer;
    font-family: 'Source Serif 4', serif; font-size: 11px; color: var(--ink-dim);
    text-transform: uppercase;
  }
  .lang-opt.active { color: var(--brass-bright); font-weight: 600; cursor: default; }
  .lang-opt:hover:not(.active) { color: var(--ink); }

  .eyebrow-right { display: inline-flex; align-items: center; }
  .info-wrap { position: relative; display: inline-flex; margin-left: 10px; }
  .info-icon {
    width: 15px; height: 15px; border-radius: 50%; padding: 0;
    border: 1px solid var(--ink-dim); background: none; color: var(--ink-dim);
    font-family: 'Source Serif 4', serif; font-style: italic; font-size: 10px;
    text-transform: none; letter-spacing: normal; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .info-icon:hover, .info-icon.active { color: var(--brass-bright); border-color: var(--brass-bright); }
  .popover {
    position: absolute; top: 22px; right: 0; width: 250px; z-index: 5;
    background: var(--ground-deep); border: 1px solid var(--brass);
    border-radius: 2px; padding: 12px 14px;
    font-family: 'Source Serif 4', serif; font-size: 12.5px; line-height: 1.6;
    color: var(--ink); text-transform: none; letter-spacing: normal;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
  }
  .popover.hidden { display: none; }
  h1 {
    font-family: 'Fraunces', serif; font-optical-sizing: auto;
    font-weight: 600; font-size: 26px; margin: 0 0 4px; letter-spacing: 0.01em;
  }
  .sub { font-size: 13px; color: var(--ink-dim); margin: 0 0 16px; }
  .notice { font-size: 13px; color: var(--brass-bright); margin: 0 0 16px; font-style: italic; }

  .streak-strip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 2px 0 16px; }
  .streak-strip.hidden { display: none; }
  /* Explicit sizing, not left to the page's generic svg{width:100%} rule
     (meant for the puzzle board) -- that rule is what previously
     stretched this to fill its flex container at an oversized, undefined
     size. Below 480px this is min(70%, 300px), unchanged from the
     original 7-point version -- narrow/mobile behavior is untouched.
     Above 480px, .page has (almost) reached its own 520px max-width, and
     70% of that (364px) is LESS than the 435px the 10-point wave now
     needs at its original dot size/spacing -- .page's own hard cap means
     no percentage-of-container formula can ever reach 435px here, so
     that tier switches to a flat 435px instead of scaling off a
     percentage. That's wide enough that "10-day streak" no longer fits
     on the same line as the dots (.page tops out at 520px, and
     435 + the 12px gap already leaves under 90px) -- the row wraps to a
     second line there, which flex-wrap already handles; the alternative
     was shrinking the dots below their original size, which was
     explicitly ruled out. height:auto follows the viewBox's own aspect
     ratio either way. */
  #streakStars { display: block; flex-shrink: 0; width: min(70%, 300px); height: auto; }
  @media (min-width: 480px) {
    #streakStars { width: 435px; }
  }
  .streak-star { fill: var(--ground-deep); stroke: var(--line); stroke-width: 1; }
  .streak-star.lit {
    fill: var(--brass-bright); stroke: var(--brass-bright);
    filter: drop-shadow(0 0 2px rgba(201, 168, 118, 0.7));
  }
  /* Slightly brighter glow on every lit star at the exact moment a
     10-day lap completes (streak is a multiple of 10) -- a small,
     one-render flourish, not an ongoing state. */
  .streak-star.lit.lap-complete {
    filter: drop-shadow(0 0 4px rgba(201, 168, 118, 0.95));
  }
  .streak-line { stroke: var(--brass); stroke-width: 1.2; opacity: 0.6; }
  #streakText { font-size: 13px; color: var(--ink-dim); }

  .badge {
    display: inline-block; padding: 1px 9px; margin: 0 1px;
    border-radius: 9px; font-size: 11px; font-weight: 600; letter-spacing: 0.03em;
  }
  .badge-easy { background: rgba(107, 143, 113, 0.22); color: var(--verdigris); border: 1px solid rgba(107, 143, 113, 0.45); }
  .badge-medium { background: rgba(176, 141, 87, 0.22); color: var(--brass-bright); border: 1px solid rgba(176, 141, 87, 0.45); }
  .badge-hard { background: rgba(178, 87, 76, 0.22); color: var(--danger); border: 1px solid rgba(178, 87, 76, 0.45); }

  .chart {
    position: relative; background: var(--ground-deep);
    border: 1px solid var(--line); border-radius: 2px; padding: 8px;
  }
  svg { width: 100%; height: auto; display: block; }
  /* Without this, a touch-drag meant to pan the board also scrolls the
     page underneath it (the browser's default touch behavior for any
     element it doesn't otherwise recognize as a scroll/drag target). */
  /* Also prevents the browser's native text-selection drag behavior from
     kicking in when a pan drag happens to pass over a node/silhouette
     label -- without this, dragging across text visibly highlights it,
     which reads as broken even though panning itself works fine. */
  #graph { touch-action: none; user-select: none; -webkit-user-select: none; }

  /* Country silhouettes, revealed on solve (see COUNTRY_SILHOUETTES /
     country_silhouettes.json) -- faint fill, thin stroke, sitting behind
     the edges and nodes. The transition is what makes the JS-driven
     opacity toggle (0 -> 1 on the next frame) actually read as a fade
     rather than a snap. */
  .country-silhouette { transition: opacity 700ms ease; }
  .country-silhouette path {
    fill: var(--verdigris); fill-opacity: 0.16;
    stroke: var(--verdigris); stroke-width: 0.75; stroke-opacity: 0.35;
  }

  /* Gap-filler countries (see GAP_FILLERS / gap_fillers.json) -- not part
     of the puzzle itself, just filling in a hole the reveal would
     otherwise leave. Deliberately more muted than .country-silhouette:
     the desaturated --line color instead of --verdigris, and noticeably
     lower opacity, so the puzzle's own countries always read as the
     "real" ones. No label/node/click-handler ever exists for these --
     nothing but a <path> gets created, so there's nothing to disable. */
  .gap-filler-silhouette { transition: opacity 700ms ease; }
  .gap-filler-silhouette path {
    fill: var(--line); fill-opacity: 0.14;
    stroke: var(--line); stroke-width: 0.75; stroke-opacity: 0.3;
  }

  .clues { margin-top: 20px; }
  .clues p.label {
    font-family: 'Source Serif 4', serif; font-size: 11px;
    color: var(--brass-bright); letter-spacing: 0.1em; text-transform: uppercase;
    margin: 20px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 6px;
  }
  .clues p.label:first-child { margin-top: 0; }
  .clues ul { margin: 0 0 8px; padding-left: 20px; font-size: 14.5px; line-height: 1.9; color: var(--ink); }
  .clues li::marker { color: var(--brass); }

  .tray { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip {
    font-family: 'Source Serif 4', serif; font-size: 13px; padding: 6px 13px;
    border: 1px solid var(--brass); border-radius: 2px; background: transparent;
    color: var(--ink); cursor: pointer;
  }
  .chip:hover:not(:disabled) { border-color: var(--brass-bright); color: var(--brass-bright); }
  .chip.used { opacity: 0.3; pointer-events: none; border-color: var(--line); }

  #hint { color: var(--brass-bright); font-size: 12.5px; min-height: 1.2em; margin: 2px 0 10px; font-style: italic; }

  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  /* 45px, matched by direct measurement (getBoundingClientRect) against
     the actual rendered gap between the Places tray and the "Clues"
     heading -- not the 20px p.label margin-top alone, because the empty
     #hint div sits between the tray and that heading and quietly
     reserves its own height (min-height:1.2em plus its own margin) even
     when it has no text in it, making the real visible Places-to-Clues
     gap noticeably bigger than 20px. Scoped to just the clue list's own
     button row (a ul directly followed by .controls), not the share
     panel's internal Copy/Share row, which sits inside its own bordered
     box with different spacing needs. */
  .clues ul + .controls { margin-top: 45px; }
  button.primary {
    font-family: 'Source Serif 4', serif; font-size: 13px; letter-spacing: 0.03em;
    padding: 9px 18px; background: var(--brass); color: var(--ground-deep);
    border: none; border-radius: 2px; cursor: pointer; text-transform: uppercase;
  }
  button.primary:hover { background: var(--brass-bright); }
  button.secondary {
    font-family: 'Source Serif 4', serif; font-size: 13px;
    padding: 9px 16px; background: transparent; color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
  }
  button.secondary:hover { color: var(--ink); border-color: var(--brass); }

  /* Board zoom: a small, secondary-weight control in a row below the
     chart -- not overlaid inside it, so it can never sit on top of
     board content (the earlier corner-overlay design was replaced once
     panning meant the player could bring any part of the puzzle under
     any corner of the frame). A minor view adjustment, not a primary
     action, so it reads at a visibly smaller scale than Check
     answer/Reset. Panning itself is real drag now (mouse or touch,
     directly on the board) -- see renderGraph's zoom/pan comment and
     the onGraphPointer* handlers for how it's disambiguated from
     tap-to-select. */
  .board-controls { display: flex; justify-content: flex-end; margin-top: 8px; }
  .zoom-controls { display: flex; gap: 4px; }
  .zoom-btn {
    font-family: 'IBM Plex Mono', monospace; font-size: 15px; line-height: 1;
    width: 26px; height: 26px; padding: 0; display: flex; align-items: center; justify-content: center;
    background: var(--ground); color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 2px; cursor: pointer;
  }
  .zoom-btn:hover:not(:disabled) { color: var(--ink); border-color: var(--brass); }
  .zoom-btn:disabled { opacity: 0.35; cursor: default; }
  .status { font-family: 'Source Serif 4', serif; font-size: 13px; color: var(--ink-dim); }
  .status.good { color: var(--brass-bright); font-weight: 600; }
  .status.bad { color: var(--danger); }

  #share {
    margin-top: 14px; padding: 12px 14px;
    background: rgba(201, 168, 118, 0.22); border: 1px solid var(--brass-bright);
    border-radius: 2px; display: flex; flex-direction: column; gap: 12px;
    box-shadow: 0 0 14px rgba(201, 168, 118, 0.4);
  }
  #share.hidden { display: none; }
  #share .controls { gap: 12px; }
  #shareLine { font-size: 14px; color: var(--brass-bright); font-weight: 600; }
  #copyStatus { font-size: 12px; color: var(--ink-dim); }

  .share-icons {
    display: flex; align-items: center; gap: 2px;
    padding-left: 8px; border-left: 1px solid var(--line);
  }
  .share-icon {
    display: flex; align-items: center; justify-content: center;
    width: 22px; height: 22px; border-radius: 50%;
    color: var(--ink-dim); text-decoration: none;
  }
  .share-icon:hover { color: var(--brass-bright); background: rgba(201, 168, 118, 0.12); }

  .footer-link {
    display: block; width: 100%; margin-top: 36px; padding: 4px;
    font-family: 'Source Serif 4', serif; font-size: 12px; color: var(--ink-dim);
    text-decoration: underline; text-align: center;
    background: none; border: none; cursor: pointer;
  }
  .footer-link:hover { color: var(--brass-bright); }

  .site-credit {
    margin-top: 36px; padding: 4px;
    font-family: 'Source Serif 4', serif; font-size: 12px; color: var(--ink-dim);
    text-align: center;
  }
  .site-credit a { color: var(--ink-dim); text-decoration: underline; }
  .site-credit a:hover { color: var(--brass-bright); }
  /* The "About the maps" trigger sits inline in the footer credit line --
     same muted/underlined treatment as the plain-text links next to it
     (no icon, unlike the header's circular "i"), but it's a <button>
     (not an <a>) since it opens a popover rather than navigating. */
  /* Cancels the 10px margin-left the shared .info-wrap class carries for
     the header's icon spacing -- this element also needs .info-wrap for
     its popover positioning/toggle logic, but reusing that class here
     was quietly adding an extra 10px on top of the JS-appended " · "
     separator already providing the gap, making this separator visibly
     wider than the one before it (measured via getBoundingClientRect:
     19.3px here vs 9.3px for the matching " · " elsewhere). */
  .footer-info-wrap { position: relative; display: inline-flex; vertical-align: baseline; margin-left: 0; }
  .footer-info-trigger {
    font-family: inherit; font-size: inherit; color: var(--ink-dim);
    text-decoration: underline; background: none; border: none; padding: 0;
    cursor: pointer;
  }
  .footer-info-trigger:hover, .footer-info-trigger.active { color: var(--brass-bright); }
  /* This popover opens above its trigger (top:auto; bottom:22px) rather
     than below like the header's -- the footer sits at the bottom of the
     page, so opening downward would push the popover off-screen. Same
     .popover box styling either way. */
  .footer-info-wrap .popover { top: auto; bottom: 22px; right: auto; left: 50%; transform: translateX(-50%); }

  .hidden { display: none; }

  .archive-back-link {
    display: inline-flex; align-items: center; gap: 4px; margin: 0 0 16px;
    font-family: 'Source Serif 4', serif; font-size: 12.5px; color: var(--brass-bright);
    text-decoration: underline; cursor: pointer;
  }
  .archive-back-link:hover { color: var(--ink); }
  /* Same thin line-icon language as the share-panel icons (stroke, not
     fill; 1.6 stroke-width; currentColor, so it always matches the
     link's own brass/hover color automatically). Small and quiet on
     purpose -- a single chevron, not a boxed button -- consistent with
     how understated Replay and the other secondary links already are. */
  /* Explicit size, not left to the page's generic svg{width:100%} rule
     (meant for the puzzle board) -- that rule has stretched other small
     icons on this page before (the streak stars, the zoom buttons) and
     would do the same here without this override. */
  .archive-back-link svg { flex-shrink: 0; width: 11px; height: 11px; }

  #archiveSection { margin-top: 20px; }
  #archiveSection p.label { margin: 20px 0 10px; }

  /* Grid of small circular markers, one per archived day -- deliberately
     mirrors the puzzle board's own node language: outline-only = unsolved
     (like an unplaced node), filled = solved (like a placed one). */
  .archive-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(40px, 1fr));
    gap: 6px;
    margin-top: 4px;
  }
  .archive-dot {
    width: 26px; height: 26px; margin: 0 auto; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace; font-size: 9px;
    background: transparent; padding: 0; box-sizing: border-box; cursor: pointer;
  }
  .archive-dot.easy { border: 1.5px solid var(--verdigris); color: var(--verdigris); }
  .archive-dot.medium { border: 1.5px solid var(--brass-bright); color: var(--brass-bright); }
  .archive-dot.hard { border: 1.5px solid var(--danger); color: var(--danger); }
  .archive-dot.solved { color: var(--ground-deep); font-weight: 600; }
  .archive-dot.solved.easy { background: var(--verdigris); }
  .archive-dot.solved.medium { background: var(--brass-bright); }
  .archive-dot.solved.hard { background: var(--danger); }
  .archive-dot:hover { filter: brightness(1.3); }
  /* Currently-viewed indicator: a ring outside the dot's own border,
     independent of the difficulty color and the solved/unsolved fill --
     outline (not border/box-shadow) so it never changes the dot's own
     size or shifts grid layout, and outline-offset keeps a visible gap
     so it reads as a distinct ring rather than just a thicker border,
     even on a medium-difficulty dot where the border/fill already use
     this same brass-bright color. */
  .archive-dot.selected { outline: 2px solid var(--brass-bright); outline-offset: 2px; }
</style>
</head>
<body>

<svg id="stars-bg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <!-- Astrolabe-style watermark, anchored off a corner via the transform
       below so most of the ring is cropped by the viewport. Coordinates
       here are LOCAL (centered on 0,0) so the anchor point can be re-tuned
       by editing just the translate() below, without recomputing geometry.
       Ticks are a true evenly-spaced ring (24, 15deg apart) -- only the
       ones that land inside the visible area actually show. The 4
       sight-lines are deliberately irregular, not evenly spaced. -->
  <g class="astrolabe" transform="translate(40, 850)">
    <circle class="ring" cx="0" cy="0" r="480"/>
    <g class="ticks">
      <line x1="462" y1="0" x2="480" y2="0"/>
      <line x1="446.3" y1="119.6" x2="463.6" y2="124.2"/>
      <line x1="400.1" y1="231" x2="415.7" y2="240"/>
      <line x1="326.7" y1="326.7" x2="339.4" y2="339.4"/>
      <line x1="231" y1="400.1" x2="240" y2="415.7"/>
      <line x1="119.6" y1="446.3" x2="124.2" y2="463.6"/>
      <line x1="0" y1="462" x2="0" y2="480"/>
      <line x1="-119.6" y1="446.3" x2="-124.2" y2="463.6"/>
      <line x1="-231" y1="400.1" x2="-240" y2="415.7"/>
      <line x1="-326.7" y1="326.7" x2="-339.4" y2="339.4"/>
      <line x1="-400.1" y1="231" x2="-415.7" y2="240"/>
      <line x1="-446.3" y1="119.6" x2="-463.6" y2="124.2"/>
      <line x1="-462" y1="0" x2="-480" y2="0"/>
      <line x1="-446.3" y1="-119.6" x2="-463.6" y2="-124.2"/>
      <line x1="-400.1" y1="-231" x2="-415.7" y2="-240"/>
      <line x1="-326.7" y1="-326.7" x2="-339.4" y2="-339.4"/>
      <line x1="-231" y1="-400.1" x2="-240" y2="-415.7"/>
      <line x1="-119.6" y1="-446.3" x2="-124.2" y2="-463.6"/>
      <line x1="0" y1="-462" x2="0" y2="-480"/>
      <line x1="119.6" y1="-446.3" x2="124.2" y2="-463.6"/>
      <line x1="231" y1="-400.1" x2="240" y2="-415.7"/>
      <line x1="326.7" y1="-326.7" x2="339.4" y2="-339.4"/>
      <line x1="400.1" y1="-231" x2="415.7" y2="-240"/>

  // the stiffer official "South-eastern Asia").
  const REGION_NAMES = {

      'Western Africa': "Afrique de l'Ouest",
      'Caribbean': 'Caraïbes', 'Central America': 'Amérique centrale',
      'South America': 'Amérique du Sud', 'Northern America': 'Amérique du Nord',
      'Central Asia': 'Asie centrale', 'Eastern Asia': "Asie de l'Est",
      'South-eastern Asia': 'Asie du Sud-Est', 'Southern Asia': 'Asie du Sud',
      'Western Asia': "Asie de l'Ouest",

      'Southern Europe': 'Europe du Sud', 'Western Europe': "Europe de l'Ouest",
      'Australia and New Zealand': 'Australie et Nouvelle-Zélande',
      'Melanesia': 'Mélanésie', 'Micronesia': 'Micronésie', 'Polynesia': 'Polynésie',
      'Africa': 'Afrique', 'Americas': 'Amériques', 'Asia': 'Asie',
      'Europe': 'Europe', 'Oceania': 'Océanie',
      'Antarctic': 'Antarctique', 'Unknown': 'Inconnu',
    },
  };

  function regionName(canonical) {
    return (REGION_NAMES[lang] && REGION_NAMES[lang][canonical]) || canonical;
  }

  function frName(name) {
    const g = GRAMMAR[name];
    return (lang === 'fr' && g) ? g.french_name : name;
  }

  function loadLang() {
    try {
      const v = localStorage.getItem(LANG_KEY);
      if (v === 'en' || v === 'fr') return v;
    } catch (e) { /* storage unavailable -- default to English */ }
    return 'en'; // default on first visit
  }

  let lang = loadLang();

  function t(key) {
    return STRINGS[lang][key];
  }

  function setLang(newLang) {
    if (newLang === lang) return;
    lang = newLang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* storage unavailable -- won't persist */ }
    render();
  }

  function langToggle() {
    const wrap = document.createElement('span');
    wrap.className = 'lang-toggle';
    ['en', 'fr'].forEach((code, i) => {
      if (i > 0) wrap.append(' / ');
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'lang-opt' + (lang === code ? ' active' : '');
      btn.textContent = code.toUpperCase();
      btn.addEventListener('click', () => setLang(code));
      wrap.appendChild(btn);
    });
    return wrap;
  }

  let puzzle = null;
  let puzzleIndex = 0;  // this puzzle's position in puzzles.json (0-based)
  let names = [];       // real countries, in true node order (node i = names[i])
  let trayNames = [];   // real names + decoys (if any), shuffled together
  let assignment = {};  // nodeIndex -> assigned name
  let selectedNode = null;
  // Board zoom: a plain multiplier applied on top of whichever viewBox
  // renderGraph() would otherwise compute (fixed unsolved box, or the
  // dynamic silhouette-expanded one) -- see the zoom block at the end of
  // renderGraph(). Reset to 1 on every puzzle load and on Replay (not on
  // the plain board Reset, which keeps the same puzzle).
  const ZOOM_MIN = 0.6, ZOOM_MAX = 2.5, ZOOM_STEP = 1.25;
  let zoomLevel = 1;
  // Board pan: an x/y offset applied after zoom, in the same SVG
  // coordinate units as the viewBox (see the pan block at the end of
  // renderGraph()). Driven by drag (see onGraphPointerMove below), which
  // converts screen-pixel drag distance into this same coordinate space.
  // Clamped every render to keep the panned+zoomed window inside the
  // puzzle's actual content box -- see renderGraph(); panBounds below is

  // (nothing reads it outside renderGraph now that there are no pan
  // buttons to disable, but it costs nothing to leave computed there).
  // Reset to (0,0) at the exact same points zoomLevel resets to 1.
  let panX = 0, panY = 0;
  let panBounds = { minPanX: 0, maxPanX: 0, minPanY: 0, maxPanY: 0 };
  let progress = freshProgress(); // persisted per puzzle, see loadProgress()

  // any interaction this session -- distinct from the live progress.solved,
  // which flips true the instant a fresh solve succeeds. Only this flag
  // should gate the "you've already solved this" notice; the live flag
  // still drives everything else (board locking, Solved! status, etc).
  let wasAlreadySolvedOnLoad = false;
  let lastCheckFailed = false; // true right after an unsuccessful "Check answer" press
  let lastCorrectCount = 0;    // correct-so-far, recomputed on each failed check (not persisted)

  // Permanent-archive model. `puzzlesData` is the full fetched array, kept
  // globally so archive browsing doesn't refetch. `todayIndex` is the real,
  // calendar-locked "live" day (null if there isn't one right now).
  // `maxReachableIndex` is the hard ceiling -- nothing past it is ever
  // reachable, by construction (see loadPuzzleAt), regardless of how much
  // more inventory exists later in the file.
  let puzzlesData = [];
  let GRAMMAR = {}; // name -> {french_name, gender, article}, from french_country_grammar.json
  let COUNTRY_SILHOUETTES = {}; // name -> [[lon,lat], ...] simplified ring, from country_silhouettes.json
  let GAP_FILLERS = []; // GAP_FILLERS[puzzleIndex] -> country names, from gap_fillers.json
  let pageStatus = 'live'; // 'before-launch' | 'not-ready' | 'live'
  let todayIndex = null;
  let maxReachableIndex = -1;
  let viewingArchived = false;

  function freshProgress() {
    // startedAt: epoch ms when the hidden timer began, set once and never
    // reset by a reload -- only "Play again" clears it.
    // elapsedSeconds: frozen at the moment of the first successful solve.
    // solvedDate: the calendar day (YYYY-MM-DD, respecting simulateDate)
    // the solve actually happened on -- used by the streak feature to tell
    // "solved on this puzzle's own live day" apart from "solved later via
    // the archive". Older saved progress predates this field and merges in
    // as null, which correctly never counts toward a streak.
    return { checks: 0, solved: false, startedAt: null, elapsedSeconds: null, solvedDate: null };
  }

  function storageKey(idx) {
    return 'borderPuzzleProgress:' + idx;
  }

  function loadProgress(idx) {
    try {
      const raw = localStorage.getItem(storageKey(idx));
      if (raw) return Object.assign(freshProgress(), JSON.parse(raw));
    } catch (e) { /* corrupt or inaccessible storage -- fall back to fresh progress */ }
    return freshProgress();
  }

  function saveProgress() {
    try {
      localStorage.setItem(storageKey(puzzleIndex), JSON.stringify(progress));
    } catch (e) { /* storage unavailable (e.g. private browsing) -- progress just won't persist */ }
  }

  // Starts the hidden timer the first time this puzzle is ever loaded (or
  // right after a "Play again" reset). A reload with startedAt already set
  // leaves it untouched, so elapsed time keeps counting across reloads.
  function ensureTimerStarted() {
    if (!progress.solved && progress.startedAt == null) {
      progress.startedAt = Date.now();
      saveProgress();
    }
  }

  function formatElapsed(totalSeconds) {
    const s = totalSeconds % 60;
    const m = Math.floor(totalSeconds / 60);
    return m > 0 ? (m + 'm' + s + 's') : (s + 's');
  }

  // Fix for the double-period bug: only add a period if the sentence
  // doesn't already end with one (country names like "Central African Rep."
  // already end in a period).
  function sentence(s) {
    return /\.$/.test(s) ? s : s + '.';
  }

  function todayIso() {
    const d = new Date();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  // Dev/preview-only override: ?simulateDate=YYYY-MM-DD in the URL
  // substitutes for "today" everywhere day-index math happens. With no
  // such parameter, this returns exactly todayIso() -- real behavior is
  // 100% unchanged for anyone who doesn't deliberately add it. Not linked
  // from anywhere in the UI, so an ordinary visitor never encounters it.
  function effectiveTodayIso() {
    const sim = new URLSearchParams(location.search).get('simulateDate');
    if (sim && /^\d{4}-\d{2}-\d{2}$/.test(sim)) {
      return sim;
    }
    return todayIso();
  }

  // Parse a "YYYY-MM-DD" string as a LOCAL midnight Date. Using `new
  // Date(iso)` directly would parse it as UTC and could land on the wrong
  // day for anyone west of UTC -- this avoids that off-by-one.
  function localDateFromIso(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d);
  }

  function daysBetween(a, b) {
    return Math.round((b - a) / 86400000);
  }

  // Inverse of localDateFromIso -- a local Date back to "YYYY-MM-DD",
  // used by the streak walk below to step backward day by day.
  function isoFromLocalDate(d) {
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + mm + '-' + dd;
  }

  // Consecutive-day streak, counting backward from today. A day only
  // counts if that day's own puzzle was solved with solvedDate equal to
  // that same day -- solving it later via the archive does not count,
  // since solvedDate would then be some later date instead. A calendar
  // day with no puzzle at all (pack not generated that far yet) is
  // skipped rather than breaking the streak. Today itself is never
  // required -- the persistent streak reflects the last *completed* day,
  // and today's own solve (if any) is added on top, which is what makes
  // the newest star light up at the moment of solving rather than only
  // on the next day's reload.
  function computeStreak() {
    const dateToIndex = {};
    puzzlesData.forEach((p, i) => { dateToIndex[p.date] = i; });

    function ownDaySolved(iso) {
      const idx = dateToIndex[iso];
      if (idx === undefined) return null; // no puzzle exists for this date
      const prog = loadProgress(idx);
      return !!(prog.solved && prog.solvedDate === iso);
    }

    let streak = 0;
    const cursor = localDateFromIso(todayIsoCached);
    cursor.setDate(cursor.getDate() - 1); // start from yesterday
    while (isoFromLocalDate(cursor) >= LAUNCH_DATE) {
      const iso = isoFromLocalDate(cursor);
      const status = ownDaySolved(iso);
      if (status === null) {
        cursor.setDate(cursor.getDate() - 1);
        continue;
      }
      if (status === false) break;
      streak++;
      cursor.setDate(cursor.getDate() - 1);
    }

    if (ownDaySolved(todayIsoCached) === true) streak++;

    return streak;
  }

  // Fixed wave/arc template -- always these same 10 positions, never
  // randomized or recomputed from the streak length itself. Only how many
  // of them are "lit" (and thus how many connecting lines are drawn)
  // changes. Same 45-unit spacing and 20-32 y-range (same dot size, same
  // gaps, same wave amplitude/shape) as the original 7-point version --
  // the extra 3 points extend the strip outward at that identical
  // spacing rather than compressing 10 points into the old 300-wide
  // viewBox, which is why the viewBox and #streakStars's width cap above
  // both grew from 300 to 435 to match.
  const STREAK_LAP = 10;
  const STREAK_POINTS = [
    [15, 32], [60, 27.9], [105, 24.3], [150, 21.6], [195, 20.2],
    [240, 20.2], [285, 21.6], [330, 24.3], [375, 27.9], [420, 32],
  ];

  function renderStreak() {
    const strip = document.getElementById('streakStrip');
    const streak = computeStreak();
    if (streak < 2) {
      strip.classList.add('hidden');
      return;
    }
    strip.classList.remove('hidden');

    // The constellation is a repeating 10-day lap, not a lifetime cap --
    // streak 10 completes a lap (all 10 lit), streak 11 starts a new one
    // (1 lit), streak 20 completes the second lap, and so on. The
    // visibility check above still uses the real streak, not this lap
    // position, so the strip never disappears when a lap boundary is
    // crossed.
    const litCount = ((streak - 1) % STREAK_LAP) + 1;
    const lapComplete = streak % STREAK_LAP === 0;
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.getElementById('streakStars');
    svg.innerHTML = '';

    for (let i = 0; i < litCount - 1; i++) {
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', STREAK_POINTS[i][0]);
      line.setAttribute('y1', STREAK_POINTS[i][1]);
      line.setAttribute('x2', STREAK_POINTS[i + 1][0]);
      line.setAttribute('y2', STREAK_POINTS[i + 1][1]);
      line.setAttribute('class', 'streak-line');
      svg.appendChild(line);
    }
    STREAK_POINTS.forEach(([x, y], i) => {
      const lit = i < litCount;
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', x);
      c.setAttribute('cy', y);
      c.setAttribute('r', lit ? 3.5 : 2);
      c.setAttribute('class', 'streak-star' + (lit ? ' lit' : '') + (lit && lapComplete ? ' lap-complete' : ''));
      svg.appendChild(c);
    });

    const textEl = document.getElementById('streakText');
    textEl.textContent = '';
    if (lang === 'fr') {
      textEl.append(t('streakPrefix'));
      textEl.append(numSpan(String(streak)));
      textEl.append(t('streakUnit')(streak));
    } else {
      textEl.append(numSpan(String(streak)));
      textEl.append(t('streakSuffix'));
    }
  }

  // DISPLAY ONLY. Internal date handling (LAUNCH_DATE, puzzles.json's
  // "date" fields, day-index math) stays in ISO YYYY-MM-DD throughout --
  // this only formats a date for something actually shown to the user, and
  // is never fed back into daysBetween/localDateFromIso or anywhere else
  // date math happens.
  const MONTH_NAMES = {
    en: ['January', 'February', 'March', 'April', 'May', 'June', 'July',
         'August', 'September', 'October', 'November', 'December'],
    fr: ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet',
         'août', 'septembre', 'octobre', 'novembre', 'décembre'],
  };

  function formatDisplayDate(iso) {
    const [y, m, d] = iso.split('-').map(Number);
    return d + ' ' + MONTH_NAMES[lang][m - 1] + ' ' + y;
  }

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
  }

  // A <span class="num"> text node -- the only text styled with IBM Plex
  // Mono, reserved for numeric data (day count / check count / timer).
  function numSpan(text) {
    const span = document.createElement('span');
    span.className = 'num';
    span.textContent = text;
    return span;
  }

  // A small color-coded pill for just the difficulty word (not the whole
  // line). `difficulty` is the canonical English value from puzzles.json
  // (e.g. "EASY") -- used for the CSS class regardless of language; only
  // the displayed text is translated.
  function difficultyBadge(difficulty) {
    const span = document.createElement('span');
    span.className = 'badge badge-' + difficulty.toLowerCase();
    span.textContent = t('difficulty')[difficulty];
    return span;
  }

  let todayIsoCached = '';

  // Pure and independently testable: given how many days have passed since
  // launch and how much inventory exists, decide what "today" means.
  //   before-launch : LAUNCH_DATE hasn't happened yet -- show day 0 as a
  //                   preview (unchanged behaviour from before the archive
  //                   model).
  //   not-ready     : launch has happened, but inventory hasn't caught up
  //                   to today yet -- no live puzzle, no stale content.
  //   live          : today has a real puzzle at this index.
  // `archiveEndIndex` is always the exclusive upper bound of what counts as
  // "strictly before today" -- i.e. the Archive list is [0, archiveEndIndex).
  function resolveTodayIndex(daysSinceLaunch, dataLength) {
    if (daysSinceLaunch < 0) {
      return { status: 'before-launch', todayIndex: 0, archiveEndIndex: 0, maxReachableIndex: 0 };
    }
    if (daysSinceLaunch >= dataLength) {
      return { status: 'not-ready', todayIndex: null, archiveEndIndex: dataLength, maxReachableIndex: dataLength - 1 };
    }
    return { status: 'live', todayIndex: daysSinceLaunch, archiveEndIndex: daysSinceLaunch, maxReachableIndex: daysSinceLaunch };
  }

  let archiveEndIndex = 0;

  // Rebuilt on every render() (not just at load) so a language toggle
  // re-translates it too.
  function renderFallbackNote() {
    const fallbackNote = document.getElementById('fallback-note');
    fallbackNote.textContent = pageStatus === 'before-launch'
      ? t('launchPrefix') + formatDisplayDate(LAUNCH_DATE) + t('launchMiddle') + formatDisplayDate(todayIsoCached) + t('launchSuffix')
      : '';

    const notReadyNote = document.getElementById('notReadyNote');
    notReadyNote.textContent = pageStatus === 'not-ready' ? t('notReady') : '';
    notReadyNote.classList.toggle('hidden', pageStatus !== 'not-ready');
  }

  // Loads and displays the puzzle at `index`, reusing the same rendering
  // pipeline regardless of whether it's today's live puzzle or an archived
  // one -- so per-puzzle progress tracking (checks/timer/solved, keyed by
  // index) works identically either way.
  //
  // HARD RULE: never loads anything past maxReachableIndex, even though
  // puzzlesData may contain more entries further down the file. This is
  // the one gate every navigation path (today, archive rows) goes through.
  function loadPuzzleAt(index) {
    if (index < 0 || index > maxReachableIndex) return;
    puzzle = puzzlesData[index];
    puzzleIndex = index;
    viewingArchived = pageStatus === 'live' && index !== todayIndex;
    progress = loadProgress(puzzleIndex);
    wasAlreadySolvedOnLoad = progress.solved;
    ensureTimerStarted();
    names = puzzle.nodes.map(n => n.name);
    trayNames = names.concat(puzzle.decoys || []);
    shuffle(trayNames);
    // A solved puzzle only ever had its status/checks/time saved, never
    // the board itself -- reconstruct it here from the puzzle's own
    // answer key so a reload shows the revealed, locked board rather
    // than an unplayed-looking one next to a "Solved!" banner.
    if (progress.solved) {
      assignment = {};
      names.forEach((nm, i) => { assignment[i] = nm; });
    } else {
      assignment = {};
    }
    selectedNode = null;
    zoomLevel = 1;
    panX = 0; panY = 0;
    lastCheckFailed = false;
    render();
  }

  // Small left-pointing chevron for the "Back to today" link -- same
  // thin-line style as the share-panel icons (stroke only, 1.6 width,
  // currentColor so it always matches the link's own color, including
  // on hover), built fresh each render since backLink's other content
  // (the translated text) is also rebuilt from scratch each time.
  function backArrowIcon() {
    const NS = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('width', '11');
    svg.setAttribute('height', '11');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '1.6');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    const path = document.createElementNS(NS, 'path');
    path.setAttribute('d', 'M15 5l-7 7 7 7');
    svg.appendChild(path);
    return svg;
  }

  function renderArchive() {
    const section = document.getElementById('archiveSection');
    const list = document.getElementById('archiveList');
    document.getElementById('archiveLabel').textContent = t('archiveLabel');

    if (archiveEndIndex <= 0) {
      section.classList.add('hidden');
      list.innerHTML = '';
      return;
    }
    section.classList.remove('hidden');
    list.innerHTML = '';
    for (let i = 0; i < archiveEndIndex; i++) {
      const p = puzzlesData[i];
      const solved = loadProgress(i).solved;
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'archive-dot ' + p.difficulty.toLowerCase() + (solved ? ' solved' : '') +
        (i === puzzleIndex ? ' selected' : '');
      dot.textContent = String(i + 1);
      const region = p.region ? regionName(p.region) : '';
      const status = solved ? t('archiveSolved') : t('archiveNotSolved');
      // Native tooltip on desktop hover; on mobile this is simply skipped
      // in favour of tapping straight through -- see loadPuzzleAt below.
      dot.title = '#' + (i + 1) + (region ? ' · ' + region : '') +
        ' · ' + t('difficulty')[p.difficulty] + ' · ' + status;
      dot.addEventListener('click', () => loadPuzzleAt(i));
      list.appendChild(dot);
    }

    // Back-to-today notice, only meaningful when a live "today" exists.
    const notice = document.getElementById('archiveNotice');
    const backLink = document.getElementById('backToTodayLink');
    const showBack = viewingArchived && pageStatus === 'live';
    notice.classList.toggle('hidden', !showBack);
    backLink.textContent = '';
    backLink.append(backArrowIcon());
    backLink.append(t('backToToday'));
    // Keyed off whether a puzzle is actually loaded, not pageStatus alone --
    // browsing into an archived puzzle from the not-ready view must still
    // reveal the board, even though "today" itself has nothing live.
    document.getElementById('puzzleContent').classList.toggle('hidden', !puzzle);
  }

  document.getElementById('backToTodayLink').addEventListener('click', e => {
    e.preventDefault();
    if (pageStatus === 'live') loadPuzzleAt(todayIndex);
  });

  async function init() {
    const [puzzlesRes, grammarRes, silhouettesRes, gapFillersRes] = await Promise.all([
      fetch('puzzles.json'),
      fetch('french_country_grammar.json'),
      fetch('country_silhouettes.json'),
      fetch('gap_fillers.json'),
    ]);
    puzzlesData = await puzzlesRes.json();
    GRAMMAR = await grammarRes.json();
    COUNTRY_SILHOUETTES = await silhouettesRes.json();
    GAP_FILLERS = await gapFillersRes.json();
    const iso = effectiveTodayIso();
    todayIsoCached = iso;
    const daysSinceLaunch = daysBetween(localDateFromIso(LAUNCH_DATE), localDateFromIso(iso));

    const resolved = resolveTodayIndex(daysSinceLaunch, puzzlesData.length);
    pageStatus = resolved.status;
    todayIndex = resolved.todayIndex;
    archiveEndIndex = resolved.archiveEndIndex;
    maxReachableIndex = resolved.maxReachableIndex;

    if (pageStatus === 'not-ready') {
      // No live puzzle to show -- just the holding message + archive.
      viewingArchived = false;
      render();
      return;
    }

    loadPuzzleAt(todayIndex);
  }

  function render() {
    document.title = t('pageTitle');
    document.getElementById('title').textContent = t('heading');
    document.getElementById('tagline').textContent = t('tagline');

    // "Geodots" stays plain text everywhere else on the page (title, meta

    // wordmark, and that's static markup (see #eyebrowLeft in the HTML),
    // not rebuilt here, so there's nothing to do on this element per
    // render. The eyebrow used to additionally show an italic sub-brand,
    // e.g. "Geodots by Hey Watson!" -- kept as dead code below in case it
    // comes back, but it appended into #eyebrowLeft, which now holds the
    // logo image instead of plain text, so it would need a different
    // home before being re-enabled.
    // const subBrandPrefix = document.createElement('em');
    // subBrandPrefix.textContent = t('subBrandPrefix');
    // eyebrowLeft.append(subBrandPrefix);
    // const subBrandLink = document.createElement('a');
    // subBrandLink.href = 'https://hey-watson.com';
    // subBrandLink.target = '_blank';
    // subBrandLink.rel = 'noopener';
    // subBrandLink.className = 'sub-brand-link';
    // subBrandLink.textContent = t('subBrandName');
    // eyebrowLeft.append(subBrandLink);

    // `puzzle` is null in the 'not-ready' state (no live puzzle exists yet)

    const eyebrowRight = document.getElementById('eyebrowRight');
    eyebrowRight.textContent = '';
    if (puzzle) {
      eyebrowRight.append(t('puzzleLabel'));

      }
    }
    eyebrowRight.append(langToggle());

    const siteCredit = document.getElementById('siteCredit');
    siteCredit.textContent = '';
    siteCredit.append(t('creditPrefix'));

    document.getElementById('infoBtn').setAttribute('aria-label', t('infoAriaLabel'));

    const subtitle = document.getElementById('subtitle');
    subtitle.textContent = '';
    if (puzzle) {
      subtitle.append(t('difficultyLabel'));
      subtitle.append(difficultyBadge(puzzle.difficulty));
      // No calendar date here, deliberately -- the puzzle number already
      // identifies/sequences it, and the game should read as evergreen
      // rather than dated. (The pre-launch notice is the one place a date

    document.getElementById('copyBtn').textContent = t('copyResult');
    document.getElementById('shareBtn').textContent = t('shareBtn');
    document.getElementById('fullResetBtn').textContent = t('replay');
    document.getElementById('zoomInBtn').setAttribute('aria-label', t('zoomIn'));
    document.getElementById('zoomInBtn').title = t('zoomIn');
    document.getElementById('zoomOutBtn').setAttribute('aria-label', t('zoomOut'));
    document.getElementById('zoomOutBtn').title = t('zoomOut');

    if (puzzle) {
      renderGraph();
      renderClues();
      renderTray();
      renderStatus();
    }
    updateZoomButtons();
    renderArchive();
  }

  // Three visual states for a triangulation-mark node. Deliberately just
  // "unassigned" / "selected" (mid-interaction, not in the mock) /
  // "assigned" -- never correct/incorrect, per the brief.
  const NODE_STYLE = {
    unassigned: { r: 13, fill: 'transparent', stroke: '#B08D57', circleWidth: 1.5, crossWidth: 1.2, labelColor: '#A9A08C' },
    selected: { r: 13, fill: 'rgba(176,141,87,0.15)', stroke: '#C9A876', circleWidth: 2.5, crossWidth: 1.8, labelColor: '#C9A876' },
    assigned: { r: 16, fill: 'rgba(107,143,113,0.15)', stroke: '#6B8F71', circleWidth: 1.5, crossWidth: 1.2, labelColor: '#E8DFC8' },
  };

  function nodeStateFor(i) {
    if (assignment[i] !== undefined) return 'assigned';
    if (selectedNode === i) return 'selected';
    return 'unassigned';
  }

  // Word order differs by language (French reads "Geodots #1 résolu en...",
  // not a stilted word-for-word translation of the English order) -- the
  // puzzle number, check count, and elapsed time always stay as numbers,
  // only the surrounding words change.
  function shareText() {
    const n = progress.checks;
    const timeStr = progress.elapsedSeconds != null ? formatElapsed(progress.elapsedSeconds) : null;
    let text = lang === 'fr'
      ? 'Geodots #' + (puzzleIndex + 1) + ' résolu en ' + n + ' ' + t('checkWord')(n)
      : 'Solved Geodots #' + (puzzleIndex + 1) + ' in ' + n + ' ' + t('checkWord')(n);
    if (timeStr) text += ', ' + timeStr;
    text += ' ✦ https://playgeodots.com';
    return text;
  }

  // Same content as shareText(), but built as DOM nodes so the numeric bits
  // (#N, check count, elapsed time) can carry the .num (Plex Mono) class.
  function renderShareLine() {
    const el = document.getElementById('shareLine');
    el.textContent = '';
    const n = progress.checks;
    if (lang === 'fr') {
      el.append('Geodots ');
      el.append(numSpan('#' + (puzzleIndex + 1)));
      el.append(' résolu en ');
      el.append(numSpan(String(n)));
      el.append(' ' + t('checkWord')(n));
    } else {
      el.append('Solved Geodots ');
      el.append(numSpan('#' + (puzzleIndex + 1)));
      el.append(' in ');
      el.append(numSpan(String(n)));
      el.append(' ' + t('checkWord')(n));
    }
    if (progress.elapsedSeconds != null) {
      el.append(', ');
      el.append(numSpan(formatElapsed(progress.elapsedSeconds)));
    }
    el.append(' ✦ playgeodots.com');
  }

  // Share-intent links for one-click desktop sharing (no Web Share API
  // needed, works in every browser). WhatsApp/X/email reuse the same
  // share text as "Copy result"; Facebook's sharer only ever accepts a
  // URL -- it builds its own preview card from the page's own
  // og:title/og:description/og:image tags, it can't be handed pre-filled
  // post text.
  function renderShareIcons() {
    const text = encodeURIComponent(shareText());
    const url = encodeURIComponent('https://playgeodots.com');
    // api.whatsapp.com/send, not wa.me -- wa.me is just a redirector to
    // this same endpoint, and on-device testing found its redirect hop
    // was dropping the ?text= param on mobile (empty compose box) even
    // though the encoded payload itself was identical to the text the
    // Web Share API sends successfully. Hitting the endpoint directly
    // avoids that redirect entirely.
    document.getElementById('shareWhatsapp').href = 'https://api.whatsapp.com/send?text=' + text;
    document.getElementById('shareTwitter').href = 'https://twitter.com/intent/tweet?text=' + text;
    document.getElementById('shareEmail').href = 'mailto:?subject=Geodots&body=' + text;
    document.getElementById('shareFacebook').href = 'https://www.facebook.com/sharer/sharer.php?u=' + url;
  }

  // Reflects `progress` (and, briefly, the outcome of the last press) in
  // three states: nothing yet, "Not solved yet" (optionally with a
  // correct-count once the player has tried enough times), or "Solved!".
  // Still no per-node coloring -- the count here is a single aggregate
  // number, not per-country feedback.
  function renderStatus() {
    const resultEl = document.getElementById('result');
    const shareDiv = document.getElementById('share');
    const alreadySolvedNote = document.getElementById('alreadySolvedNote');
    // Persistent on every visit, and this is also the solve-moment reward:
    // checkAnswer() saves solvedDate then calls renderStatus(), so the
    // newest star lights up as part of the same status update, not a
    // separate step.
    renderStreak();
    document.getElementById('checkBtn').classList.toggle('hidden', progress.solved);
    document.getElementById('resetBtn').classList.toggle('hidden', progress.solved);
    if (progress.solved) {
      resultEl.textContent = t('solved');
      resultEl.className = 'status good';
      renderShareLine();
      renderShareIcons();
      shareDiv.classList.remove('hidden');
      if (wasAlreadySolvedOnLoad) {
        alreadySolvedNote.textContent = viewingArchived ? t('alreadySolvedArchive') : t('alreadySolved');
        alreadySolvedNote.classList.remove('hidden');
      } else {
        alreadySolvedNote.classList.add('hidden');
      }
    } else if (lastCheckFailed) {
      // First 3 failed checks stay plain; the count only appears once the
      // player has been at it a while. Uses the existing checks counter --
      // no separate storage needed.
      const showCount = progress.checks >= 4;
      resultEl.textContent = showCount
        ? t('notSolvedYet') + t('correctSuffix')(lastCorrectCount, names.length)
        : t('notSolvedYet');
      resultEl.className = 'status bad';
      shareDiv.classList.add('hidden');
      alreadySolvedNote.classList.add('hidden');
    } else {
      resultEl.textContent = '';
      resultEl.className = 'status';
      shareDiv.classList.add('hidden');
      alreadySolvedNote.classList.add('hidden');
    }
  }

  // Zoom stays buttons-only -- no pinch/gesture zoom. Pan, below, is
  // real drag now (mouse or touch), disambiguated from tap-to-select by
  // START POSITION alone: a gesture beginning on a node's own clickable
  // hit area (the circle, cursor:pointer, only present when the board
  // isn't locked-solved) is left completely alone for the browser's
  // normal click handling; a gesture beginning anywhere else on the
  // board starts a pan. No movement-distance threshold anywhere.
  function setZoom(next) {
    zoomLevel = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, next));
    renderGraph(); // also re-clamps panX/panY, since zooming changes the pan range
    updateZoomButtons();
  }
  function zoomIn() { setZoom(zoomLevel * ZOOM_STEP); }
  function zoomOut() { setZoom(zoomLevel / ZOOM_STEP); }
  function updateZoomButtons() {
    const inBtn = document.getElementById('zoomInBtn');
    const outBtn = document.getElementById('zoomOutBtn');
    if (!inBtn || !outBtn) return;
    inBtn.disabled = zoomLevel >= ZOOM_MAX - 1e-9;
    outBtn.disabled = zoomLevel <= ZOOM_MIN + 1e-9;
  }

  // True iff `target` is a node's own clickable circle -- the exact
  // element the existing tap-to-select click handler is attached to
  // (see renderGraph: cursor is only set to 'pointer', and the click
  // listener only attached, when the board isn't locked-solved). This
  // is the one check that decides drag vs. tap: starting here never
  // begins a pan, regardless of how far the pointer moves afterward.
  function isNodeHit(target) {
    return !!target && target.tagName === 'circle' && target.style.cursor === 'pointer';
  }

  let dragging = false;
  let dragStartClientX = 0, dragStartClientY = 0;
  let dragStartPanX = 0, dragStartPanY = 0;

  function onGraphPointerDown(e) {
    if (!puzzle || isNodeHit(e.target)) return; // leave tap-to-select alone
    dragging = true;
    dragStartClientX = e.clientX;
    dragStartClientY = e.clientY;
    dragStartPanX = panX;
    dragStartPanY = panY;
    const svg = document.getElementById('graph');
    try { svg.setPointerCapture(e.pointerId); } catch (err) { /* older browsers -- drag still works via document-level listeners below */ }
  }

  function onGraphPointerMove(e) {
    if (!dragging) return;
    const svg = document.getElementById('graph');
    const rect = svg.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return; // not currently visible
    const vb = svg.viewBox.baseVal;
    // Screen-pixel drag distance converted to SVG units via the current
    // viewBox-to-screen scale -- dragging the cursor right should bring
    // content on the LEFT into view, i.e. move the viewBox window left,
    // so panX moves opposite the drag direction (the usual "grab the
    // map and slide it" feel).
    const scaleX = vb.width / rect.width;
    const scaleY = vb.height / rect.height;
    panX = dragStartPanX - (e.clientX - dragStartClientX) * scaleX;
    panY = dragStartPanY - (e.clientY - dragStartClientY) * scaleY;
    renderGraph(); // clamps panX/panY against the content box, same as before
  }

  function onGraphPointerUp(e) {
    if (!dragging) return;
    dragging = false;
    const svg = document.getElementById('graph');
    try { svg.releasePointerCapture(e.pointerId); } catch (err) { /* already released/unsupported */ }
  }

  function renderGraph() {
    const svg = document.getElementById('graph');
    svg.innerHTML = '';
    const W = 480, H = 300, margin = 55;

    const lons = puzzle.nodes.map(n => n.position[0]);
    const lats = puzzle.nodes.map(n => n.position[1]);
    const minLon = Math.min(...lons), maxLon = Math.max(...lons);
    const minLat = Math.min(...lats), maxLat = Math.max(...lats);
    const spanLon = Math.max(maxLon - minLon, 0.001);
    const spanLat = Math.max(maxLat - minLat, 0.001);
    const availW = W - 2 * margin, availH = H - 2 * margin;
    const scale = Math.min(availW / spanLon, availH / spanLat);
    const offX = margin + (availW - spanLon * scale) / 2;
    const offY = margin + (availH - spanLat * scale) / 2;

    const pos = puzzle.nodes.map(n => ({
      x: offX + (n.position[0] - minLon) * scale,
      y: offY + (maxLat - n.position[1]) * scale, // lat increases north = up
    }));

    const nameIndex = {};
    names.forEach((nm, i) => { nameIndex[nm] = i; });

    const NS = 'http://www.w3.org/2000/svg';

    // Solved-state-only, and only actually alters anything when a
    // country's full polygon (e.g. Russia) extends well beyond the small
    // node-based frame above -- otherwise this is a no-op and the viewBox
    // stays exactly "0 0 W H", byte-identical to before. Node pixel
    // positions in `pos` above are never touched -- same scale/offX/offY,
    // same numbers. This only decides how much of that same coordinate
    // space the SVG actually shows, by growing the viewBox outward to
    // include every silhouette point (the puzzle's own countries AND any
    // gap fillers, see below) that would otherwise fall outside it and
    // get silently clipped.
    const showSilhouettes = progress.solved && puzzle.nodes.every(n => COUNTRY_SILHOUETTES[n.name]);
    // Gap fillers: countries not in this puzzle that would otherwise show
    // up as a visible hole in the revealed map (2+ borders onto the
    // puzzle's own countries, or a known enclave like Lesotho/San
    // Marino/Vatican City -- see audit_silhouette_gaps.py, whose
    // check_puzzle() this list was precomputed with by
    // build_gap_fillers.py). Filtered against COUNTRY_SILHOUETTES the
    // same defensive way as the puzzle's own countries -- a gap filler
    // with no geometry just doesn't render, rather than breaking anything.
    const gapFillerNames = showSilhouettes
      ? (GAP_FILLERS[puzzleIndex] || []).filter(name => COUNTRY_SILHOUETTES[name])
      : [];

    let viewMinX = 0, viewMinY = 0, viewMaxX = W, viewMaxY = H;
    if (showSilhouettes) {
      // The viewBox is sized purely from the puzzle's OWN countries' true
      // full extent, union the base W x H frame -- gap fillers contribute
      // no expansion at all. A gap filler's silhouette is still drawn in
      // full at its real position; whatever part of it falls inside this
      // own-countries frame is visible, the rest is left outside where
      // SVG already clips it by default. This means a large gap filler
      // (Russia next to Central Asia, China next to Southeast Asia) may
      // only show a partial corner of its shape -- expected, not a bug --
      // in exchange for the puzzle's own countries always being shown at
      // their true, unshrunk size.
      puzzle.nodes.forEach(n => {
        COUNTRY_SILHOUETTES[n.name].forEach(([lon, lat]) => {
          const x = offX + (lon - minLon) * scale;
          const y = offY + (maxLat - lat) * scale;
          if (x < viewMinX) viewMinX = x;
          if (x > viewMaxX) viewMaxX = x;
          if (y < viewMinY) viewMinY = y;
          if (y > viewMaxY) viewMaxY = y;
        });
      });

      const pad = 15;
      viewMinX -= pad; viewMinY -= pad; viewMaxX += pad; viewMaxY += pad;
    }

    // The box as computed so far -- fixed W x H, or the dynamic
    // silhouette-expanded one -- is the puzzle's actual content extent.
    // Zoom and pan both need it: zoom centers on it, pan is clamped to
    // stay inside it.
    const baseMinX = viewMinX, baseMinY = viewMinY, baseMaxX = viewMaxX, baseMaxY = viewMaxY;

    // Board zoom, applied first -- a multiplier on top of the content
    // box above, centered on THAT box's own center point rather than a
    // fixed origin, so zooming alone (before any panning) always keeps
    // the content centered.
    if (zoomLevel !== 1) {
      const cx = (viewMinX + viewMaxX) / 2;
      const cy = (viewMinY + viewMaxY) / 2;
      const zoomedW = (viewMaxX - viewMinX) / zoomLevel;
      const zoomedH = (viewMaxY - viewMinY) / zoomLevel;
      viewMinX = cx - zoomedW / 2; viewMaxX = cx + zoomedW / 2;
      viewMinY = cy - zoomedH / 2; viewMaxY = cy + zoomedH / 2;
    }

    // Board pan, applied on top of the zoomed box -- a plain x/y
    // translation, clamped so the panned+zoomed window can never move
    // outside the content box above. When zoomed out to 1x or below,
    // the zoomed box is already >= the content box in both dimensions,
    // so both bounds collapse to 0 and panning becomes a no-op --
    // panning only ever does anything once zoomed in past 1x.
    const minPanX = Math.min(0, baseMinX - viewMinX);
    const maxPanX = Math.max(0, baseMaxX - viewMaxX);
    const minPanY = Math.min(0, baseMinY - viewMinY);
    const maxPanY = Math.max(0, baseMaxY - viewMaxY);
    panX = Math.max(minPanX, Math.min(maxPanX, panX));
    panY = Math.max(minPanY, Math.min(maxPanY, panY));
    panBounds = { minPanX, maxPanX, minPanY, maxPanY };
    viewMinX += panX; viewMaxX += panX;
    viewMinY += panY; viewMaxY += panY;

    svg.setAttribute('viewBox', [viewMinX, viewMinY, viewMaxX - viewMinX, viewMaxY - viewMinY].join(' '));

    // Faint lat/long graticule behind everything, same proportions as the
    // reference mock's 480x300 chart.
    const grat = document.createElementNS(NS, 'g');
    grat.setAttribute('stroke', 'var(--line)');
    grat.setAttribute('stroke-width', '0.5');
    grat.setAttribute('opacity', '0.5');
    [60, 120, 180, 240].forEach(y => {
      const ln = document.createElementNS(NS, 'line');
      ln.setAttribute('x1', 0); ln.setAttribute('y1', y);
      ln.setAttribute('x2', W); ln.setAttribute('y2', y);
      grat.appendChild(ln);
    });
    [80, 160, 240, 320, 400].forEach(x => {
      const ln = document.createElementNS(NS, 'line');
      ln.setAttribute('x1', x); ln.setAttribute('y1', 0);
      ln.setAttribute('x2', x); ln.setAttribute('y2', H);
      grat.appendChild(ln);
    });
    svg.appendChild(grat);

    // Gap-filler silhouettes, painted first so the puzzle's own countries
    // (drawn next, below) sit on top of them at any shared border. No
    // label, no node circle, no click handler ever gets attached to
    // these -- they're built from nothing but a <path>, so there is
    // nothing on them to interact with. Visually more muted than the
    // real countries via .gap-filler-silhouette's own (lower) opacity,
    // not the .country-silhouette styling.
    if (gapFillerNames.length) {
      const gapG = document.createElementNS(NS, 'g');
      gapG.setAttribute('class', 'gap-filler-silhouette');
      gapG.style.opacity = '0';
      gapFillerNames.forEach(name => {
        const ring = COUNTRY_SILHOUETTES[name];
        const d = ring.map(([lon, lat], i) => {
          const x = offX + (lon - minLon) * scale;
          const y = offY + (maxLat - lat) * scale;
          return (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
        }).join(' ') + ' Z';
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        gapG.appendChild(path);
      });
      svg.appendChild(gapG);
      requestAnimationFrame(() => { gapG.style.opacity = '1'; });
    }

    // Faint country outlines, solved-state only, sitting behind the
    // edges/nodes drawn below. Looked up from COUNTRY_SILHOUETTES
    // (fetched once at startup from country_silhouettes.json, built by
    // build_country_silhouettes.py for every country that appears as a
    // node anywhere in the pack). showSilhouettes (computed above,
    // alongside the viewBox sizing that depends on the same lookup) is
    // true only when every node in THIS puzzle has a matching entry --
    // true for every real puzzle by construction, but kept as a guard so
    // a missing/partial fetch just means no silhouette rather than a
    // broken one, and decoys (never in puzzle.nodes) can never trigger
    // this. Reuses minLon/maxLat/scale/offX/offY computed above from the
    // node positions -- not a separate transform, the literal same
    // numbers that placed the nodes -- so a country's outline necessarily
    // lands exactly around its own node.
    if (showSilhouettes) {
      const silG = document.createElementNS(NS, 'g');
      silG.setAttribute('class', 'country-silhouette');
      silG.style.opacity = '0';
      puzzle.nodes.forEach(n => {
        const ring = COUNTRY_SILHOUETTES[n.name];
        const d = ring.map(([lon, lat], i) => {
          const x = offX + (lon - minLon) * scale;
          const y = offY + (maxLat - lat) * scale;
          return (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
        }).join(' ') + ' Z';
        const path = document.createElementNS(NS, 'path');
        path.setAttribute('d', d);
        silG.appendChild(path);
      });
      svg.appendChild(silG);
      // Fade in on the next frame -- part of the same "Solved!" state
      // change, not a separate reveal. Runs every time renderGraph()
      // redraws while solved (including a plain reload), which is a
      // deliberate simplification for this proof of concept.
      requestAnimationFrame(() => { silG.style.opacity = '1'; });
    }

    // Edges, one shared-style group (matches the mock's approach).
    const edgeG = document.createElementNS(NS, 'g');
    edgeG.setAttribute('stroke', 'var(--brass)');
    edgeG.setAttribute('stroke-width', '1');
    edgeG.setAttribute('opacity', '0.55');
    puzzle.edges.forEach(([a, b]) => {
      const i = nameIndex[a], j = nameIndex[b];
      const line = document.createElementNS(NS, 'line');
      line.setAttribute('x1', pos[i].x);
      line.setAttribute('y1', pos[i].y);
      line.setAttribute('x2', pos[j].x);
      line.setAttribute('y2', pos[j].y);
      edgeG.appendChild(line);
    });
    svg.appendChild(edgeG);

    // Triangulation-mark nodes: circle + cross, open/brass when unassigned,
    // filled/verdigris-tinted once correctly -- well, once -- assigned.
    pos.forEach((p, i) => {
      const style = NODE_STYLE[nodeStateFor(i)];
      const g = document.createElementNS(NS, 'g');

      const circle = document.createElementNS(NS, 'circle');
      circle.setAttribute('cx', p.x);
      circle.setAttribute('cy', p.y);
      circle.setAttribute('r', style.r);
      circle.setAttribute('fill', style.fill);
      circle.setAttribute('stroke', style.stroke);
      circle.setAttribute('stroke-width', style.circleWidth);
      // Once solved, the board is a locked, revealed answer -- Replay is
      // the only way back into an interactive state, so nodes stop
      // responding to clicks entirely rather than letting a tap re-open
      // an already-complete board.
      if (progress.solved) {
        circle.style.cursor = 'default';
      } else {
        circle.style.cursor = 'pointer';
        circle.addEventListener('click', () => onNodeClick(i));
      }
      g.appendChild(circle);

      [[-1, 0, 1, 0], [0, -1, 0, 1]].forEach(([x1f, y1f, x2f, y2f]) => {
        const ln = document.createElementNS(NS, 'line');
        const r = style.r;
        ln.setAttribute('x1', p.x + x1f * r * 0.6);
        ln.setAttribute('y1', p.y + y1f * r * 0.6);
        ln.setAttribute('x2', p.x + x2f * r * 0.6);
        ln.setAttribute('y2', p.y + y2f * r * 0.6);
        ln.setAttribute('stroke', style.stroke);
        ln.setAttribute('stroke-width', style.crossWidth);
        ln.style.pointerEvents = 'none';
        g.appendChild(ln);
      });

      const label = document.createElementNS(NS, 'text');
      label.setAttribute('x', p.x);
      label.setAttribute('y', p.y - 22);
      label.setAttribute('text-anchor', 'middle');
      // Not "IBM Plex Mono, monospace" as in the mock's own script -- a
      // country name / "?" isn't numeric data, so per the brief this stays
      // Source Serif 4. See the top-of-file note.
      label.setAttribute('font-family', "'Source Serif 4', serif");
      label.setAttribute('font-size', '10');
      label.setAttribute('fill', style.labelColor);
      label.style.pointerEvents = 'none';
      label.textContent = assignment[i] ? frName(assignment[i]) : '?';
      g.appendChild(label);

      svg.appendChild(g);
    });
  }

  function renderClues() {
    const ul = document.getElementById('clueList');
    ul.innerHTML = '';
    // French chrome has been translated throughout; this is the first
    // piece of actual PUZZLE content (clue sentences) that's now also
    // available in French, via the pre-rendered "clues_fr" array.
    const source = (lang === 'fr' && puzzle.clues_fr) ? puzzle.clues_fr : puzzle.clues;
    source.forEach(c => {
      const li = document.createElement('li');
      li.textContent = sentence(c);
      ul.appendChild(li);
    });
  }

  function renderTray() {
    const container = document.getElementById('chips');
    container.innerHTML = '';
    const used = new Set(Object.values(assignment));
    trayNames.forEach(nm => {
      const chip = document.createElement('button');
      // Once solved, every chip is locked regardless of whether it happens
      // to be "used" -- decoys included, since the used-set alone wouldn't
      // cover names that were never assigned to a node.
      const isUsed = progress.solved || used.has(nm);
      chip.className = 'chip' + (isUsed ? ' used' : '');
      chip.textContent = frName(nm);
      chip.disabled = isUsed;
      chip.addEventListener('click', () => onChipClick(nm));
      container.appendChild(chip);
    });
  }

  function onNodeClick(i) {
    lastCheckFailed = false;
    document.getElementById('hint').textContent = '';

    if (assignment[i] !== undefined) {
      // Tapping an assigned node clears it and selects it for a new choice.
      delete assignment[i];
      selectedNode = i;
    } else if (selectedNode === i) {
      selectedNode = null; // tap again to deselect
    } else {
      selectedNode = i;
    }
    render();
  }

  function onChipClick(name) {
    if (selectedNode === null) {
      document.getElementById('hint').textContent = t('hint');
      return;
    }
    lastCheckFailed = false;
    document.getElementById('hint').textContent = '';

    assignment[selectedNode] = name;
    selectedNode = null;
    render();
  }

  // No per-node coloring, ever. Every press before the first success counts
  // toward the share line; once solved, the count is locked in and further
  // presses don't change it. On a failed check, a single AGGREGATE correct
  // count is computed (not shown until the 4th failed press) -- still not
  // per-country feedback, just one number.
  function checkAnswer() {
    const total = names.length;
    const allAssigned = Object.keys(assignment).length === total;
    const correctCount = names.reduce((sum, truth, i) => sum + (assignment[i] === truth ? 1 : 0), 0);
    const solvedNow = allAssigned && correctCount === total;

    if (!progress.solved) {
      progress.checks += 1;
      if (solvedNow) {
        progress.solved = true;
        const startedAt = progress.startedAt != null ? progress.startedAt : Date.now();
        progress.elapsedSeconds = Math.max(0, Math.round((Date.now() - startedAt) / 1000));
        progress.solvedDate = todayIsoCached;
        renderGraph(); // repaint now that progress.solved is true -- this is
                        // what triggers the country-silhouette fade-in at
                        // the exact moment of solving, not on the next
                        // unrelated re-render.
      } else {
        lastCorrectCount = correctCount;
      }
      saveProgress();
    }
    lastCheckFailed = !progress.solved;
    renderStatus();
  }

  function resetPuzzle() {
    assignment = {};
    selectedNode = null;
    lastCheckFailed = false;
    document.getElementById('hint').textContent = '';
    render();
  }

  // Full reset: unlike resetPuzzle() (board only), this wipes the stored
  // check count and solved status for today's puzzle, as if never played.
  function fullReset() {
    const ok = confirm(t('confirmReset'));
    if (!ok) return;
    try {
      localStorage.removeItem(storageKey(puzzleIndex));
    } catch (e) { /* storage unavailable -- nothing to clear */ }
    progress = freshProgress();
    wasAlreadySolvedOnLoad = false; // replaying is a fresh solve, not a return visit
    ensureTimerStarted(); // restart the hidden timer immediately, as if freshly loaded
    assignment = {};
    selectedNode = null;
    zoomLevel = 1;
    panX = 0; panY = 0;
    lastCheckFailed = false;
    document.getElementById('hint').textContent = '';
    render();
  }

  function copyResult() {
    const status = document.getElementById('copyStatus');
    navigator.clipboard.writeText(shareText()).then(() => {
      status.textContent = t('copied');
      setTimeout(() => { status.textContent = ''; }, 2000);
    }).catch(() => {
      status.textContent = t('copyFailed');
    });
  }

  // Web Share API opens the device's native share sheet (texting, AirDrop,
  // etc.) -- only on browsers that support it, mainly mobile. The button
  // stays hidden everywhere else (checked once at load, below), so desktop
  // visitors just see "Copy result" as before; nothing to fall back to at
  // click time since the button isn't there to click.
  function shareResult() {
    navigator.share({ text: shareText() }).catch(() => {});
  }

  document.getElementById('checkBtn').addEventListener('click', checkAnswer);
  document.getElementById('resetBtn').addEventListener('click', resetPuzzle);
  document.getElementById('copyBtn').addEventListener('click', copyResult);
  document.getElementById('shareBtn').addEventListener('click', shareResult);
  if (navigator.share) {
    document.getElementById('shareBtn').classList.remove('hidden');
  }
  document.getElementById('fullResetBtn').addEventListener('click', fullReset);
  document.getElementById('zoomInBtn').addEventListener('click', zoomIn);
  document.getElementById('zoomOutBtn').addEventListener('click', zoomOut);
  // Drag-to-pan: attached once, directly on the board's own SVG, rather
  // than re-attached inside renderGraph() (which rebuilds the node/edge/
  // silhouette elements every render but never touches the <svg> element
  // itself, so a listener here survives every re-render undisturbed).
  const graphSvg = document.getElementById('graph');
  graphSvg.addEventListener('pointerdown', onGraphPointerDown);
  graphSvg.addEventListener('pointermove', onGraphPointerMove);
  graphSvg.addEventListener('pointerup', onGraphPointerUp);
  graphSvg.addEventListener('pointercancel', onGraphPointerUp);

  // Popovers (header "i" info icon, footer "About the maps" link): click
  // (not hover, so it works on touch) toggles the popover; a click
  // anywhere outside its own trigger/box closes it; opening one closes
  // the other, so at most one is ever open. Same toggle/dismiss logic for
  // both -- just a different trigger id, popover id, and close-the-other
  // callback each time.
  function makePopoverToggle(btnId, popoverId) {
    return function setOpen(open) {
      document.getElementById(popoverId).classList.toggle('hidden', !open);
      document.getElementById(btnId).classList.toggle('active', open);
      document.getElementById(btnId).setAttribute('aria-expanded', String(open));
    };
  }
  const setInfoOpen = makePopoverToggle('infoBtn', 'infoPopover');
  const setAboutMapsOpen = makePopoverToggle('aboutMapsBtn', 'aboutMapsPopover');

  document.getElementById('infoBtn').addEventListener('click', e => {
    e.stopPropagation();
    setAboutMapsOpen(false);
    setInfoOpen(document.getElementById('infoPopover').classList.contains('hidden'));
  });
  document.getElementById('aboutMapsBtn').addEventListener('click', e => {
    e.stopPropagation();
    setInfoOpen(false);
    setAboutMapsOpen(document.getElementById('aboutMapsPopover').classList.contains('hidden'));
  });
  document.addEventListener('click', e => {
    if (!document.getElementById('infoBtn').closest('.info-wrap').contains(e.target)) setInfoOpen(false);
    if (!document.getElementById('aboutMapsBtn').closest('.info-wrap').contains(e.target)) setAboutMapsOpen(false);
  });

  init();
</script>
</body>
</html>
